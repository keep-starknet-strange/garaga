name: SP1 compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-sp1-compatibility:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo/sp1_verifier/target
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check reference test formatting
        run: cargo fmt --manifest-path tools/sp1_verifier/Cargo.toml --all --check
      - name: Check Garaga calldata for the committed receipt
        run: cargo test --locked --manifest-path tools/sp1_verifier/Cargo.toml
      - name: Install Foundry for the official Solidity verifier
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - name: Verify the receipt with the official Solidity verifier
        run: |
          python3 tools/sp1_verifier/download_reference.py
          forge test --root tools/sp1_verifier -vv
