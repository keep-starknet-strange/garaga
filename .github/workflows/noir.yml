name: Noir source and receipt compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the pinned Noir and Barretenberg binaries
        run: |
          uv run --no-project --python 3.11 tools/noir/install.py "$RUNNER_TEMP/noir-sdk"
          echo "$RUNNER_TEMP/noir-sdk" >> "$GITHUB_PATH"
      - name: Compile Noir, rebuild keys, verify receipts, and reject modified receipts
        run: tools/noir/run.sh --check --solidity
      - name: Install Foundry for the upstream Solidity reference
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - name: Verify stored receipts with the upstream Solidity verifiers
        run: forge test --root tools/noir -vv
      - name: Check the Solidity models against the SDK-generated source AST
        run: uv run --no-project --python 3.11 tools/noir/formal/generate.py --side solidity --check
