name: Lean correctness proofs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.21.0"
          cache: false
      - name: Check Cairo control flow against the compiler AST
        run: uv run --no-project --python 3.11 tools/divide_and_pair/formal/control_flow.py --check
      - name: Install the checksum-pinned Lean SDK
        run: uv run --no-project --python 3.11 tools/noir/formal/install.py "$RUNNER_TEMP/lean-sdk" >> "$GITHUB_PATH"
      - name: Check Honk proofs and audit theorem dependencies
        run: tools/noir/formal/check.sh
      - name: Check Ed25519 proofs and audit theorem dependencies
        run: tools/divide_and_pair/formal/check.sh
