[package]
name = "universal_ecip"
version = "0.1.0"
edition = "2024_07"

[dependencies]
garaga = { path = "../.." }
starknet = "2.21.0"

[cairo]
sierra-replace-ids = false
# Match the ECIP class hash compiled by generated verifier tests.
inlining-strategy = 2

[[target.starknet-contract]]
casm = true
casm-add-pythonic-hints = true
build-external-contracts = ["garaga::universal_ecip::UniversalECIP"]
